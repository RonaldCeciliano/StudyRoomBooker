# Production email: Gmail SMTP with an app password. Values come from the environment
# only; never commit real credentials. SmtpEmailSender fails startup if they are unset.
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
app.email.from=${EMAIL_FROM:${SMTP_USERNAME:}}
# Keep /actuator/health independent of Gmail availability.
management.health.mail.enabled=false

# Production sessions: Secure cookie, and the public HTTPS origin is required.
app.base-url=${APP_BASE_URL:}
server.servlet.session.cookie.secure=true

# Production database: Compose supplies DB_URL/DB_USERNAME/DB_PASSWORD from the server's .env.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'America/Chicago'
# Caddy terminates HTTPS and forwards X-Forwarded-* headers.
server.forward-headers-strategy=framework
