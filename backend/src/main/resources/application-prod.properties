# Production email: Gmail SMTP with an app password. Values come from the environment
# only; never commit real credentials. SmtpEmailSender fails startup if they are unset.
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
app.email.from=${EMAIL_FROM:${SMTP_USERNAME:}}
# Keep /actuator/health independent of Gmail availability.
management.health.mail.enabled=false
