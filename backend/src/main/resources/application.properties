spring.application.name=backend
spring.mvc.problemdetails.enabled=true
app.time-zone=America/Chicago
spring.jpa.properties.hibernate.jdbc.time_zone=${app.time-zone}

# Swagger UI displays the committed contract; runtime scanning is not authoritative.
springdoc.swagger-ui.url=/openapi/studyroombooker.yaml
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.supported-submit-methods=

# Magic-link sign-in. The link points at the React confirmation page.
app.base-url=${APP_BASE_URL:http://localhost:5173}
app.auth.login-token-ttl=15m
app.auth.resend-cooldown=60s
server.servlet.session.timeout=7d
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
