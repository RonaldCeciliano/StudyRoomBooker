# StudyRoomBooker REST contract (ADR 0006).
#
# Provisional: written by hand until the Spring Boot backend exists. Once it does,
# springdoc-openapi generates this file from the controllers and it is committed
# here. The frontend generates its TypeScript types from it with
# `npm run generate:api` (in frontend/).
openapi: 3.1.0
info:
  title: StudyRoomBooker API
  version: 0.1.0
paths:
  /api/shifts:
    get:
      operationId: listShifts
      summary: List upcoming shifts
      tags: [shifts]
      responses:
        '200':
          description: Upcoming shifts in chronological order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Shift'
        default:
          $ref: '#/components/responses/Problem'
components:
  schemas:
    ShiftStatus:
      type: string
      enum: [UNASSIGNED, ASSIGNED, BOOKED, MISSED, CANCELLED]
    Shift:
      type: object
      required: [id, startsAt, endsAt, status, plannedRoomCode, memberName]
      properties:
        id:
          type: integer
          format: int64
        startsAt:
          type: string
          format: date-time
          description: ISO 8601 instant.
        endsAt:
          type: string
          format: date-time
          description: ISO 8601 instant.
        status:
          $ref: '#/components/schemas/ShiftStatus'
        plannedRoomCode:
          type: string
          examples: ['441D']
        memberName:
          type: [string, 'null']
          description: Assigned member's name, or null when the shift is unassigned.
    ProblemDetail:
      description: RFC 9457 problem details, as produced by Spring's ProblemDetail.
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
  responses:
    Problem:
      description: Error response.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
