name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint, types, tests, contract, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            docs/openapi/package-lock.json
      - name: Install contract tooling
        run: npm ci --prefix docs/openapi
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: npm run check
        run: npm run check
        working-directory: frontend

  backend:
    name: Backend (compile, unit and PostgreSQL integration tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Testcontainers uses the runner's Docker engine for PostgreSQL 17.
      - name: ./mvnw test
        run: ./mvnw -B -ntp test
        working-directory: backend
